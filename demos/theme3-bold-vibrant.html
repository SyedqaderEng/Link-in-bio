<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme 3: Bold & Vibrant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0F0F23;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background gradient */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 0, 255, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 229, 255, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(196, 255, 14, 0.2) 0%, transparent 50%);
            animation: rotateGradient 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotateGradient {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
            animation: slideUp 0.7s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Profile section */
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, #FF00FF, #00E5FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            color: white;
            font-weight: 700;
            border: 4px solid rgba(255, 255, 255, 0.2);
            animation: pulse 3s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
            position: relative;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 20px rgba(255, 0, 255, 0.5),
                            0 0 40px rgba(0, 229, 255, 0.3);
            }
            to {
                box-shadow: 0 0 30px rgba(255, 0, 255, 0.8),
                            0 0 60px rgba(0, 229, 255, 0.6);
            }
        }

        .profile-name {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #FF00FF, #00E5FF, #C4FF0E);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            animation: gradientShift 3s ease infinite;
            letter-spacing: -1px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .profile-bio {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 400;
        }

        /* Social icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 22px;
            position: relative;
            overflow: hidden;
        }

        .social-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF00FF, #00E5FF);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-icon:hover::before {
            opacity: 1;
        }

        .social-icon:hover {
            transform: translateY(-5px) rotate(5deg);
            border-color: transparent;
        }

        .social-icon span {
            position: relative;
            z-index: 1;
        }

        /* Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-item {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 229, 255, 0.2));
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 20px 28px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, #FF00FF, #00E5FF, #C4FF0E);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-item:hover::after {
            opacity: 1;
        }

        .link-item:hover {
            transform: translateX(8px) scale(1.02);
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.3), rgba(0, 229, 255, 0.3));
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        .link-icon {
            font-size: 26px;
            filter: drop-shadow(0 0 10px currentColor);
        }

        .link-arrow {
            font-size: 24px;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .link-item:hover .link-arrow {
            transform: translateX(8px);
            filter: drop-shadow(0 0 10px currentColor);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #FF00FF, #00E5FF, #C4FF0E);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .profile-name {
                font-size: 36px;
            }

            .profile-image {
                width: 110px;
                height: 110px;
                font-size: 44px;
            }

            .link-item {
                padding: 18px 24px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <div class="profile-image">MJ</div>
            <h1 class="profile-name">Max Jordan</h1>
            <p class="profile-bio">Music Producer & DJ 🎧<br>Bringing the beats that move your soul</p>
        </div>

        <div class="social-icons">
            <a href="#" class="social-icon" aria-label="Spotify"><span>🎵</span></a>
            <a href="#" class="social-icon" aria-label="SoundCloud"><span>☁️</span></a>
            <a href="#" class="social-icon" aria-label="YouTube"><span>▶️</span></a>
            <a href="#" class="social-icon" aria-label="Instagram"><span>📷</span></a>
            <a href="#" class="social-icon" aria-label="TikTok"><span>🎬</span></a>
        </div>

        <div class="links">
            <a href="#" class="link-item">
                <span class="link-content">
                    <span class="link-icon">🎵</span>
                    <span>Listen to Latest Album</span>
                </span>
                <span class="link-arrow">→</span>
            </a>

            <a href="#" class="link-item">
                <span class="link-content">
                    <span class="link-icon">🎫</span>
                    <span>Get Concert Tickets</span>
                </span>
                <span class="link-arrow">→</span>
            </a>

            <a href="#" class="link-item">
                <span class="link-content">
                    <span class="link-icon">🛍️</span>
                    <span>Shop Merch</span>
                </span>
                <span class="link-arrow">→</span>
            </a>

            <a href="#" class="link-item">
                <span class="link-content">
                    <span class="link-icon">🎧</span>
                    <span>Production Masterclass</span>
                </span>
                <span class="link-arrow">→</span>
            </a>

            <a href="#" class="link-item">
                <span class="link-content">
                    <span class="link-icon">📧</span>
                    <span>Join VIP List</span>
                </span>
                <span class="link-arrow">→</span>
            </a>

            <a href="#" class="link-item">
                <span class="link-content">
                    <span class="link-icon">🎹</span>
                    <span>Free Sample Pack</span>
                </span>
                <span class="link-arrow">→</span>
            </a>
        </div>

        <div class="footer">
            <p>Turn It Up • Feel The Vibes</p>
        </div>
    </div>
</body>
</html>
