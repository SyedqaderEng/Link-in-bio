<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme 1: Glassmorphic Modern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            animation: gradient 15s ease infinite;
            background-size: 400% 400%;
            z-index: -1;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 680px;
            width: 100%;
            padding: 40px 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glass card */
        .profile-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* Profile section */
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            font-weight: 600;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .profile-name {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .profile-bio {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Social icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .social-icon:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px) scale(1.1);
        }

        /* Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-item {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 18px 24px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-icon {
            font-size: 24px;
        }

        .link-arrow {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .link-item:hover .link-arrow {
            transform: translateX(5px);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .profile-name {
                font-size: 28px;
            }

            .profile-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-image">AS</div>
                <h1 class="profile-name">Alex Smith</h1>
                <p class="profile-bio">Digital Creator & Designer 🎨<br>Making the web beautiful, one pixel at a time</p>
            </div>

            <div class="social-icons">
                <a href="#" class="social-icon" aria-label="Instagram">📷</a>
                <a href="#" class="social-icon" aria-label="Twitter">🐦</a>
                <a href="#" class="social-icon" aria-label="YouTube">▶️</a>
                <a href="#" class="social-icon" aria-label="TikTok">🎵</a>
            </div>

            <div class="links">
                <a href="#" class="link-item">
                    <span class="link-content">
                        <span class="link-icon">🎨</span>
                        <span>View My Portfolio</span>
                    </span>
                    <span class="link-arrow">→</span>
                </a>

                <a href="#" class="link-item">
                    <span class="link-content">
                        <span class="link-icon">🛍️</span>
                        <span>Shop My Designs</span>
                    </span>
                    <span class="link-arrow">→</span>
                </a>

                <a href="#" class="link-item">
                    <span class="link-content">
                        <span class="link-icon">📧</span>
                        <span>Join Newsletter</span>
                    </span>
                    <span class="link-arrow">→</span>
                </a>

                <a href="#" class="link-item">
                    <span class="link-content">
                        <span class="link-icon">🎓</span>
                        <span>Free Design Course</span>
                    </span>
                    <span class="link-arrow">→</span>
                </a>

                <a href="#" class="link-item">
                    <span class="link-content">
                        <span class="link-icon">📱</span>
                        <span>Download My App</span>
                    </span>
                    <span class="link-arrow">→</span>
                </a>

                <a href="#" class="link-item">
                    <span class="link-content">
                        <span class="link-icon">💬</span>
                        <span>Book a Consultation</span>
                    </span>
                    <span class="link-arrow">→</span>
                </a>
            </div>

            <div class="footer">
                <p>Made with ❤️ using LinkBio</p>
            </div>
        </div>
    </div>
</body>
</html>
